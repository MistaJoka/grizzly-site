name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI verifies the indexable build: Lighthouse's SEO budget (minScore 1) needs robots.txt to allow
      # crawling, which only a configured SITE_URL does. Deployment sets its own values in pages.yml.
      SITE_URL: https://grizzlysite.andraewilliams.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate placeholder imagery
        run: npm run placeholders
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Performance budget
        run: npm run test:perf
