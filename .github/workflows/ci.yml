name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI verifies the indexable build: Lighthouse's SEO budget (minScore 1) needs robots.txt to allow
      # crawling, which only a configured SITE_URL does. Deployment sets its own values in pages.yml.
      SITE_URL: https://grizzlysite.andraewilliams.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate placeholder imagery
        run: npm run placeholders
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: SEO audit (indexable build)
        run: npm run test:seo
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Demo end-to-end tests (DEMO_DATA=1, as deployed to staging)
        run: npm run test:e2e:demo
      - name: Performance budget (demo build, indexable only for the audit)
        # Staging serves the demo build; DEMO_ALLOW_INDEXABLE lifts the guard so Lighthouse's SEO
        # budget (minScore 1 needs robots to allow crawling) can run against it.
        run: DEMO_DATA=1 DEMO_ALLOW_INDEXABLE=1 npm run build && npm run test:perf
      - name: SEO audit (held-back demo build, exactly as deployed to staging)
        run: HOLD_BACK=1 DEMO_DATA=1 npm run build && HOLD_BACK=1 DEMO_DATA=1 npm run test:seo
