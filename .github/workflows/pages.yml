name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables).
          # SITE_URL unset => the build stays noindex / robots-blocked.
          SITE_URL: ${{ vars.SITE_URL }}
          # HOLD_BACK=1 => real URLs but still noindex (staging). Delete the variable to go live.
          HOLD_BACK: ${{ vars.HOLD_BACK }}
          GROUNDWORK_QUOTE_URL: ${{ vars.GROUNDWORK_QUOTE_URL }}
          # Only needed for a github.io project page; leave unset with a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
